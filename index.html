<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", Tahoma, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    padding: 24px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b6b6b; font-size: 13px; }
  .updated { color: #8a8a8a; font-size: 12px; margin-top: 4px; }
  .range-bar { margin: 0 0 16px; padding: 12px 16px; }
  .range-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .preset-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset-btn {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #d8d8d4;
    background: #fff;
    color: #444;
    cursor: pointer;
  }
  .preset-btn:hover { background: #f2f2ef; }
  .preset-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .preset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-switch-bar { margin: 0 0 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .page-switch-bar .label { font-size: 12.5px; color: #6b6b6b; }
  .page-btn {
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid #d8d8d4;
    background: #fff;
    color: #444;
    cursor: pointer;
  }
  .page-btn:hover { background: #f2f2ef; }
  .page-btn.active { background: #2c6fbb; color: #fff; border-color: #2c6fbb; }
  .custom-range { display: flex; gap: 12px; font-size: 12.5px; color: #555; align-items: center; }
  .custom-range input[type="date"] {
    border: 1px solid #d8d8d4;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12.5px;
    font-family: inherit;
  }
  .range-hint { margin-top: 8px; font-size: 11.5px; color: #9a9a9a; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 20px 0;
  }
  .kpi-card {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .kpi-label { font-size: 12px; color: #7a7a7a; margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 700; color: #1a1a1a; }
  .kpi-sub { font-size: 11px; color: #9a9a9a; margin-top: 4px; }
  .panels {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e5e2;
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: #333; }
  .static-note { font-weight: 400; font-size: 11px; color: #b0a06a; }
  .chart-box { position: relative; height: 260px; }
  table.ads-list { width: 100%; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge.active { background: #e6f4ea; color: #1e7e34; }
  .badge.paused { background: #fdecea; color: #b3261e; }
  .page-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    background: #eef2ff;
    color: #3949ab;
  }
  .notes {
    background: #fff8e6;
    border: 1px solid #f0dfa1;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 16px;
    font-size: 12.5px;
    color: #5c4a1a;
    line-height: 1.7;
  }
  .notes h2 { font-size: 13px; margin: 0 0 8px; color: #5c4a1a; }
  .notes ul { margin: 0; padding-left: 18px; }
  #ads-grid .gridjs-wrapper { border-radius: 8px; }
  #ads-grid .gridjs-table, #ads-grid .gridjs-th, #ads-grid .gridjs-td, #ads-grid .gridjs-search-input { font-size: 12.5px; }
  #ads-grid .gridjs-th-content { white-space: normal; overflow: visible; text-overflow: unset; line-height: 1.3; }
  #ads-grid .gridjs-td { padding: 8px 10px; }
  #ads-grid .gridjs-th { padding: 8px 10px; }

  /* เปรียบเทียบรายเพจ */
  .pages-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .pages-row.single { grid-template-columns: 1fr; }
  .page-card { background: #fff; border: 1px solid #e5e5e2; border-radius: 10px; padding: 16px; }
  .page-card .page-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .page-card h3 { font-size: 14px; margin: 0; color: #333; }
  .page-card .page-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .page-card .page-stat { font-size: 12px; color: #7a7a7a; }

  /* ยอดผู้ติดตาม/Like */
  .followers-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .followers-row.single { grid-template-columns: 1fr; }
  .followers-card { background: #fff; border: 1px solid #e5e5e2; border-radius: 10px; padding: 16px; }
  .followers-card h3 { font-size: 14px; margin: 0 0 10px; color: #333; }
  .followers-value { font-size: 26px; font-weight: 700; color: #1a1a1a; }
  .followers-change { font-size: 12.5px; margin-top: 6px; }
  .followers-change.up { color: #1e7e34; }
  .followers-change.down { color: #b3261e; }
  .followers-change.flat { color: #7a7a7a; }
  .followers-change.unavailable { color: #9a9a9a; }
  .page-card .page-stat b { display: block; font-size: 16px; color: #1a1a1a; font-weight: 700; margin-top: 2px; }

  /* เป้าหมายธุรกิจ + โฆษณาเด่น */
  .spotlight-row { margin-bottom: 16px; }

  .spotlight-body { display: flex; gap: 14px; }
  .spotlight-img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: #f0f0ee; flex-shrink: 0; }
  .spotlight-img.placeholder { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #b0b0ac; text-align: center; padding: 6px; }
  .spotlight-info { flex: 1; min-width: 0; }
  .spotlight-title { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .spotlight-copy { font-size: 12px; color: #666; line-height: 1.5; max-height: 54px; overflow: hidden; margin-bottom: 8px; }
  .spotlight-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: #7a7a7a; }
  .spotlight-stats b { color: #1a1a1a; }
</style>

  renderFollowersRow();
});

// ---- Date range picker over DATA.daily (ช่วงเวลาที่เลือกได้อิงจากข้อมูลทั้งบัญชีเสมอ) ----
const allDates = DATA.daily.map(d => d.date).sort();
const minDate = allDates[0];
const maxDate = allDates[allDates.length - 1];
const spanDays = Math.round((new Date(maxDate) - new Date(minDate)) / 86400000) + 1;

const presets = [
  { key: "7d", label: "7 วันล่าสุด", days: 7 },
  { key: "14d", label: "14 วันล่าสุด", days: 14 },
  { key: "30d", label: "30 วันล่าสุด", days: 30 },
  { key: "90d", label: "90 วันล่าสุด", days: 90 },
  { key: "all", label: "ทั้งหมดที่มีข้อมูล", days: null }
];

const presetGroup = document.getElementById("preset-group");
presetGroup.innerHTML = presets.map(p => {
  const disabled = p.days !== null && p.days > spanDays && p.key !== "all";
  return `<button class="preset-btn" data-key="${p.key}" ${disabled ? "disabled title='ยังไม่มีข้อมูลย้อนหลังถึง " + p.days + " วัน'" : ""}>${p.label}</button>`;
}).join("");

const fromInput = document.getElementById("date-from");
const toInput = document.getElementById("date-to");
fromInput.min = minDate; fromInput.max = maxDate;
toInput.min = minDate; toInput.max = maxDate;

let dailyChartInstance = null;
let platformChartInstance = null;

function applyRange(since, until) {
  currentSince = since; currentUntil = until;
  [...presetGroup.querySelectorAll(".preset-btn")].forEach(b => b.classList.remove("active"));
  fromInput.value = since;
  toInput.value = until;

  const rows = getDailyRows().filter(d => d.date >= since && d.date <= until);
  const pageAds = getPageAds();
  const spend = rows.reduce((s, d) => s + d.spend, 0);
  const impressions = rows.reduce((s, d) => s + d.impressions, 0);
  const reachSum = rows.reduce((s, d) => s + d.reach, 0);
  const clicks = rows.reduce((s, d) => s + d.clicks, 0);
  const messages = rows.reduce((s, d) => s + (d.messages || 0), 0);
  const leadsInRange = rows.reduce((s, d) => s + (d.leads || 0), 0);
  const hasDailyLeads = rows.some(d => typeof d.leads === "number");
  const cpc = clicks > 0 ? spend / clicks : 0;
  const cpm = impressions > 0 ? (spend / impressions) * 1000 : 0;
  const ctr = impressions > 0 ? (clicks / impressions) * 100 : 0;
  const isFullSummaryRange = since === DATA.dateRange.since && until === DATA.dateRange.until;

  const pageLabel = selectedPage === "all" ? `บัญชี ${DATA.account.name}` : (DATA.account.pages.find(p => p.pageId === selectedPage)?.pageName || selectedPage);
  document.getElementById("range-label").textContent =
    `ช่วงที่เลือก: ${new Date(since).toLocaleDateString("th-TH",{day:"numeric",month:"short"})} - ${new Date(until).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})} (${rows.length} วัน) · ${pageLabel}`;
  document.getElementById("range-hint").textContent =
    `มีข้อมูลรายวันตั้งแต่ ${minDate} ถึง ${maxDate} (${spanDays} วัน) — เลือกช่วงนอกเหนือจากนี้ไม่ได้จนกว่าจะรัน daily_refresh.cjs ใหม่`;

  const kpis = [
    { label: "ค่าแอดรวม", value: fmtBaht(spend), sub: isFullSummaryRange ? "" : "" },
    { label: "Impressions", value: fmtNum(impressions), sub: "CPM " + fmtBaht(cpm) },
    { label: "Reach (รวมรายวัน)", value: fmtNum(reachSum), sub: "ค่าประมาณ ไม่ใช่ unique reach ที่แท้จริง" },
    { label: "Clicks", value: fmtNum(clicks), sub: "CPC " + fmtBaht(cpc) },
    { label: "CTR", value: ctr.toFixed(2) + "%", sub: "" },
    { label: "เริ่มทักแชท (Messages)", value: fmtNum(messages), sub: "CPC ต่อแชท " + fmtBaht(messages > 0 ? spend / messages : 0) },
    hasDailyLeads
      ? { label: "Leads", value: fmtNum(leadsInRange), sub: "ตามช่วงเวลาที่เลือก" }
      : { label: "Leads (7 วันล่าสุด)", value: fmtNum(DATA.summary7d.leads), sub: "ไม่มีข้อมูลรายวัน จึงกรองตามช่วงไม่ได้" },
    { label: "จำนวนโฆษณาที่แอคทีฟ", value: pageAds.filter(a => a.status === "ACTIVE").length + " / " + pageAds.length, sub: "ค่าคงที่ 7 วันล่าสุด" }
  ];
  document.getElementById("kpi-grid").innerHTML = kpis.map(k =>
    `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div>${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ""}</div>`
  ).join("");

  if (dailyChartInstance) dailyChartInstance.destroy();
  dailyChartInstance = new Chart(document.getElementById("dailyChart"), {
    type: "line",
    data: {
      labels: rows.map(d => new Date(d.date).toLocaleDateString("th-TH", {day:"numeric", month:"short"})),
      datasets: [
        {
          label: "ค่าแอด (฿)",
          data: rows.map(d => d.spend),
          borderColor: "#c0392b",
          backgroundColor: "rgba(192,57,43,0.08)",
          yAxisID: "y",
          tension: 0.3,
          fill: true
        },
        {
          label: "Clicks",
          data: rows.map(d => d.clicks),
          borderColor: "#2c6fbb",
          backgroundColor: "rgba(44,111,187,0.08)",
          yAxisID: "y1",
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        y: { position: "left", title: { display: true, text: "฿" } },
        y1: { position: "right", title: { display: true, text: "Clicks" }, grid: { drawOnChartArea: false } }
      }
    }
  });

  renderPagesRow();
}

presetGroup.addEventListener("click", (e) => {
  const btn = e.target.closest(".preset-btn");
  if (!btn || btn.disabled) return;
  [...presetGroup.querySelectorAll(".preset-btn")].forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const preset = presets.find(p => p.key === btn.dataset.key);
  let since;
  if (preset.key === "all") {
    since = minDate;
  } else {
    const untilD = new Date(maxDate);
    const sinceD = new Date(untilD);
    sinceD.setDate(sinceD.getDate() - (preset.days - 1));
    since = toISO(sinceD) < minDate ? minDate : toISO(sinceD);
  }
  applyRange(since, maxDate);
});

[fromInput, toInput].forEach(inp => inp.addEventListener("change", () => {
  if (!fromInput.value || !toInput.value) return;
  if (fromInput.value > toInput.value) return;
  applyRange(fromInput.value, toInput.value);
}));

// default view: full available range
applyRange(minDate, maxDate);
presetGroup.querySelector('[data-key="all"]').classList.add("active");

function renderPlatformChart() {
  const rows = getPlatformRows();
  if (platformChartInstance) platformChartInstance.destroy();
  platformChartInstance = new Chart(document.getElementById("platformChart"), {
    type: "doughnut",
    data: {
      labels: rows.map(p => p.platform),
      datasets: [{
        data: rows.map(p => p.spend),
        backgroundColor: ["#c0392b", "#2c6fbb", "#7a8c3a", "#c9a227", "#7a5cc9"]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { font: { size: 11 } } } }
    }
  });
}
renderPlatformChart();

let adsGrid = null;
function buildAdsGridData() {
  return getPageAds().map(a => [a.name, a.page, a.status, a.spend, a.impressions, a.reach, a.clicks, a.cpc, a.ctr, a.messages]);
}
function renderAdsGrid() {
  if (adsGrid) { adsGrid.updateConfig({ data: buildAdsGridData() }).forceRender(); return; }
  adsGrid = new gridjs.Grid({
    columns: [
      { name: "โฆษณา", id: "name" },
      { name: "เพจ", id: "page", formatter: (cell) => gridjs.html(`<span class="page-tag">${cell}</span>`) },
      { name: "สถานะ", id: "status", formatter: (cell) => gridjs.html(`<span class="badge ${cell === "ACTIVE" ? "active" : "paused"}">${cell === "ACTIVE" ? "Active" : "Paused"}</span>`) },
      { name: "ค่าแอด", id: "spend", formatter: (cell) => fmtBaht(cell) },
      { name: "Impressions", id: "impressions", formatter: (cell) => fmtNum(cell) },
      { name: "Reach", id: "reach", formatter: (cell) => fmtNum(cell) },
      { name: "Clicks", id: "clicks", formatter: (cell) => fmtNum(cell) },
      { name: "CPC", id: "cpc", formatter: (cell) => fmtBaht(cell) },
      { name: "CTR", id: "ctr", formatter: (cell) => cell.toFixed(2) + "%" },
      { name: "แชท", id: "messages", formatter: (cell) => fmtNum(cell) }
    ],
    data: buildAdsGridData(),
    sort: true,
    search: true,
    pagination: { limit: 10 }
  }).render(document.getElementById("ads-grid"));
}
renderAdsGrid();

document.getElementById("notes-list").innerHTML = (DATA.dataNotes || []).map(n => `<li>${n}</li>`).join("");

// ---- ยอดผู้ติดตาม/Like ปัจจุบัน + เทียบกับสิ้นเดือนที่แล้ว ----
// ไม่ผูกกับช่วงเวลาที่เลือกด้านบน (เทียบเดือนต่อเดือนเสมอ) ผูกกับ selectedPage เท่านั้น
function renderFollowersRow() {
  const followersRow = document.getElementById("followers-row");
  if (!DATA.followers || DATA.followers.length === 0) return;
  const targets = selectedPage === "all" ? DATA.followers : DATA.followers.filter(f => f.pageId === selectedPage);
  followersRow.style.display = "grid";
  followersRow.classList.toggle("single", targets.length === 1);
  followersRow.innerHTML = targets.map(f => {
    let changeHtml;
    if (f.current == null) {
      changeHtml = `<div class="followers-change unavailable">ดึงยอดผู้ติดตามไม่สำเร็จ</div>`;
    } else if (f.changePct == null) {
      changeHtml = `<div class="followers-change unavailable">ยังไม่มีข้อมูลเทียบเดือนที่แล้ว (เริ่มเก็บข้อมูลตั้งแต่วันนี้)</div>`;
    } else {
      const dir = f.changeAbs > 0 ? "up" : f.changeAbs < 0 ? "down" : "flat";
      const sign = f.changeAbs > 0 ? "+" : "";
      const arrow = f.changeAbs > 0 ? "▲" : f.changeAbs < 0 ? "▼" : "—";
      changeHtml = `<div class="followers-change ${dir}">${arrow} ${sign}${fmtNum(f.changeAbs)} (${sign}${f.changePct.toFixed(2)}%) จากสิ้นเดือนที่แล้ว (${new Date(f.baselineDate).toLocaleDateString("th-TH",{day:"numeric",month:"short"})})</div>`;
    }
    return `
      <div class="followers-card">
        <h3>${f.pageName}</h3>
        <div class="followers-value">${f.current != null ? fmtNum(f.current) : "-"}</div>
        ${changeHtml}
      </div>
    `;
  }).join("");
}
renderFollowersRow();

// ---- เปรียบเทียบรายเพจ (City Link Condo vs Mayfair Market) — ตามช่วงเวลาที่เลือกด้านบน ----
// เมื่อเลือกดูเพจใดเพจหนึ่ง จะโชว์การ์ดของเพจนั้นเพจเดียว (ไม่ใช่ตารางเปรียบเทียบ)
// คำนวณจาก DATA.dailyByPage สดๆ ตาม currentSince/currentUntil ไม่ใช้ pagesSummary7d
// ที่เป็นค่าคงที่ 7 วันอีกต่อไป
function computePageStats(pageId, since, until) {
  const rows = (DATA.dailyByPage?.[pageId] || []).filter(d => d.date >= since && d.date <= until);
  const spend = rows.reduce((s, d) => s + d.spend, 0);
  const impressions = rows.reduce((s, d) => s + d.impressions, 0);
  const reachSum = rows.reduce((s, d) => s + d.reach, 0);
  const clicks = rows.reduce((s, d) => s + d.clicks, 0);
  const messages = rows.reduce((s, d) => s + (d.messages || 0), 0);
  return {
    spend, impressions, reachSum, clicks, messages,
    cpc: clicks > 0 ? spend / clicks : 0,
    ctr: impressions > 0 ? (clicks / impressions) * 100 : 0
  };
}
function renderPagesRow() {
  const pagesRow = document.getElementById("pages-row");
  const pageList = DATA.account.pages || [];
  if (pageList.length === 0 || !currentSince || !currentUntil) return;
  const targets = selectedPage === "all" ? pageList : pageList.filter(p => p.pageId === selectedPage);
  pagesRow.style.display = "grid";
  pagesRow.classList.toggle("single", targets.length === 1);
  pagesRow.innerHTML = targets.map(p => {
    const s = computePageStats(p.pageId, currentSince, currentUntil);
    const adsCount = DATA.ads.filter(a => a.pageId === p.pageId).length;
    return `
      <div class="page-card">
        <div class="page-card-head">
          <h3>${p.pageName}</h3>
          <span class="page-tag">${adsCount} โฆษณา</span>
        </div>
        <div class="page-stat-grid">
          <div class="page-stat">ค่าแอด<b>${fmtBaht(s.spend)}</b></div>
          <div class="page-stat">Reach (รวม)<b>${fmtNum(s.reachSum)}</b></div>
          <div class="page-stat">Clicks<b>${fmtNum(s.clicks)}</b></div>
          <div class="page-stat">CPC<b>${fmtBaht(s.cpc)}</b></div>
          <div class="page-stat">CTR<b>${s.ctr.toFixed(2)}%</b></div>
          <div class="page-stat">แชท<b>${fmtNum(s.messages)}</b></div>
        </div>
      </div>
    `;
  }).join("");
}

// ---- โฆษณาเด่นประจำสัปดาห์ (Active + ใช้งบสูงสุด) ----
function renderSpotlight() {
  const pageAds = getPageAds();
  const body = document.getElementById("spotlight-body");
  if (!pageAds || pageAds.length === 0) {
    body.innerHTML = `<div class="static-note">ไม่มีโฆษณาของเพจนี้ในช่วงข้อมูลล่าสุด</div>`;
    return;
  }
  const activeAds = pageAds.filter(a => a.status === "ACTIVE");
  const topAd = (activeAds.length > 0 ? activeAds : pageAds).slice().sort((a, b) => b.spend - a.spend)[0];
  const creative = topAd.creative || {};
  const imgHtml = creative.imageUrl
    ? `<img class="spotlight-img" src="${creative.imageUrl}" alt="">`
    : `<div class="spotlight-img placeholder">ไม่มีรูปตัวอย่าง<br>(ต้องเพิ่มสิทธิ์ ads_read เพื่อดึงรูปจริง)</div>`;
  body.innerHTML = `
    <div class="spotlight-body">
      ${imgHtml}
      <div class="spotlight-info">
        <div class="spotlight-title">${creative.title || topAd.name}</div>
        <div class="spotlight-copy">${creative.body || "(ไม่มีข้อความโฆษณา)"}</div>
        <div class="spotlight-stats">
          <span>เพจ <b>${topAd.page}</b></span>
          <span>ค่าแอด <b>${fmtBaht(topAd.spend)}</b></span>
          <span>Reach <b>${fmtNum(topAd.reach)}</b></span>
          <span>แชท <b>${fmtNum(topAd.messages)}</b></span>
          <span>CTR <b>${topAd.ctr.toFixed(2)}%</b></span>
        </div>
      </div>
    </div>
  `;
}
if (DATA.ads && DATA.ads.length > 0) renderSpotlight();
</script>
</body>
